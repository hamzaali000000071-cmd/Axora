<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AXORA Admin</title><style>body{margin:0;background:#07131d;color:#eaf7f7;font:15px system-ui}.wrap{max-width:1100px;margin:auto;padding:18px}.panel{background:#102331;border:1px solid #234052;border-radius:16px;padding:20px;margin:12px 0}.brand{color:#28d9b0;font-size:28px;font-weight:900;letter-spacing:4px}.field{width:100%;box-sizing:border-box;padding:13px;margin:8px 0;background:#071923;color:white;border:1px solid #234052;border-radius:10px}button{padding:12px;border:0;border-radius:10px;background:#28d9b0;font-weight:700;width:100%}.secondary{background:#1a3545;color:white}.hidden{display:none!important}.error{color:#ff9aa4;min-height:22px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat strong{display:block;font-size:28px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #234052}th{color:#91aab4}.scroll{overflow:auto}@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><div id="loginView" class="wrap"><div class="panel" style="max-width:420px;margin:12vh auto"><div class="brand">AXORA</div><h2>Admin Console</h2><p>Admin account only. Private message content is not accessible.</p><button id="google">Continue with Google</button><p style="text-align:center">or email login</p><input id="email" class="field" placeholder="Admin email"><input id="password" class="field" type="password" placeholder="Password"><button id="login" class="secondary">Secure Login</button><p id="error" class="error"></p></div></div><div id="dash" class="wrap hidden"><div style="display:flex;justify-content:space-between;align-items:center"><div class="brand">AXORA ADMIN</div><button id="logout" class="secondary" style="width:auto">Sign out</button></div><p>Account metadata and reports only — no message access.</p><div class="grid"><div class="panel stat">Users<strong id="uc">—</strong></div><div class="panel stat">Conversations<strong id="cc">—</strong></div><div class="panel stat">Open reports<strong id="rc">—</strong></div></div><div class="panel"><h2>Users</h2><input id="search" class="field" placeholder="Filter email or name"><p id="dataError" class="error"></p><div class="scroll"><table><thead><tr><th>Name</th><th>Email</th><th>Joined</th></tr></thead><tbody id="users"></tbody></table></div></div><div class="panel"><h2>Reports</h2><div class="scroll"><table><thead><tr><th>Reason</th><th>Details</th><th>Status</th></tr></thead><tbody id="reports"></tbody></table></div></div></div>
<script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const URL='YOUR_SUPABASE_PROJECT_URL',KEY='YOUR_SUPABASE_ANON_KEY',ok=URL.startsWith('https://')&&!URL.includes('YOUR_')&&!KEY.includes('YOUR_'),$=x=>document.getElementById(x);let sb,all=[];const err=s=>$('error').textContent=s;async function gate(u){if(!u){$('loginView').classList.remove('hidden');$('dash').classList.add('hidden');return}let{data,error}=await sb.rpc('is_current_user_admin');if(error||data!==true){err(error?.message||'Access denied: not an administrator.');await sb.auth.signOut();return}$('loginView').classList.add('hidden');$('dash').classList.remove('hidden');load()}async function load(){try{let[u,c,r]=await Promise.all([sb.from('profiles').select('email,display_name,created_at').order('created_at',{ascending:false}).limit(500),sb.from('conversations').select('id',{count:'exact',head:true}),sb.from('reports').select('reason,details,status').order('created_at',{ascending:false}).limit(100)]);if(u.error)throw u.error;if(c.error)throw c.error;if(r.error)throw r.error;all=u.data;$('uc').textContent=all.length;$('cc').textContent=c.count??0;$('rc').textContent=r.data.filter(x=>x.status==='open').length;render();$('reports').innerHTML='';r.data.forEach(x=>{let tr=document.createElement('tr');[x.reason,x.details,x.status].forEach(v=>{let td=document.createElement('td');td.textContent=v||'—';tr.append(td)});$('reports').append(tr)});if(!r.data.length)$('reports').innerHTML='<tr><td colspan="3">No reports</td></tr>'}catch(e){$('dataError').textContent=e.message}}function render(){let q=$('search').value.toLowerCase();$('users').innerHTML='';all.filter(x=>(x.email||'').toLowerCase().includes(q)||(x.display_name||'').toLowerCase().includes(q)).forEach(x=>{let tr=document.createElement('tr');[x.display_name,x.email,x.created_at?new Date(x.created_at).toLocaleString():'—'].forEach(v=>{let td=document.createElement('td');td.textContent=v||'—';tr.append(td)});$('users').append(tr)})}if(ok){sb=createClient(URL,KEY);sb.auth.onAuthStateChange((_e,s)=>gate(s?.user));sb.auth.getSession().then(({data})=>gate(data.session?.user||null))}else err('Add Supabase URL and anon key, then run supabase-schema.sql.');$('google').onclick=async()=>{if(!ok)return err('Supabase is not configured.');let{error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href}});if(error)err(error.message)};$('login').onclick=async()=>{if(!ok)return err('Supabase is not configured.');let{error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)err(error.message)};$('logout').onclick=()=>sb.auth.signOut();$('search').oninput=render;</script></body></html>

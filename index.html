<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1424"><link rel="manifest" href="./manifest.webmanifest"><title>AXORA Messenger</title><style>
:root{color-scheme:dark;--bg:#091321;--p:#111f31;--p2:#1b2c43;--line:#2a3c55;--t:#edf4ff;--m:#9aacc2;--a:#63e3bb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px system-ui}button,input{font:inherit}button{border:0;border-radius:12px;padding:12px 15px;background:var(--a);color:#092018;font-weight:750}button.alt{background:var(--p2);color:var(--t);border:1px solid var(--line)}.hide{display:none!important}.auth{min-height:100dvh;display:grid;place-items:center;padding:18px;background:radial-gradient(ellipse at top,#234363,transparent 60%),var(--bg)}.card{width:min(100%,430px);background:var(--p);padding:26px;border:1px solid var(--line);border-radius:24px}.logo{font-size:34px;letter-spacing:5px;font-weight:950;color:var(--a)}.muted{color:var(--m);font-size:12px}.field{width:100%;padding:14px;margin:7px 0;background:#0b1628;color:var(--t);border:1px solid var(--line);border-radius:12px}.actions{display:flex;gap:9px;margin-top:10px}.actions>*{flex:1}.error{color:#ff8995;min-height:24px;font-size:13px;overflow-wrap:anywhere}.app{height:100dvh;display:grid;grid-template-columns:340px 1fr;background:var(--p)}.side{display:flex;flex-direction:column;border-right:1px solid var(--line)}.sidehead{padding:17px;border-bottom:1px solid var(--line)}.row{display:flex;align-items:center;justify-content:space-between}.row .logo{font-size:24px}.profile{color:var(--m);font-size:12px;margin:7px 0}.chatlist{overflow:auto}.chatitem{display:flex;gap:12px;align-items:center;padding:14px;border-bottom:1px solid #ffffff0a;cursor:pointer}.chatitem.active,.chatitem:hover{background:var(--p2)}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#315b80,#23735f);font-weight:800}.chatmeta{min-width:0;flex:1}.chatname{font-weight:750}.chatmail{font-size:12px;color:var(--m);overflow:hidden;text-overflow:ellipsis}.empty{padding:24px;text-align:center;color:var(--m)}.main{display:flex;flex-direction:column;min-width:0}.welcome{margin:auto;text-align:center;color:var(--m)}.chatpanel{display:flex;flex-direction:column;flex:1;min-height:0}.chathead{display:flex;align-items:center;gap:12px;padding:13px 17px;border-bottom:1px solid var(--line)}.messages{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px}.bubble{max-width:80%;padding:11px 14px;border-radius:17px;background:#20334d;align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere}.mine{align-self:flex-end;background:#155143}.bubble time{display:block;text-align:right;color:#b1c1d3;font-size:10px}.composer{display:flex;gap:9px;padding:12px;border-top:1px solid var(--line)}.composer input{flex:1;min-width:0}.status{padding:4px 16px;color:var(--m);font-size:12px}.back{display:none}@media(max-width:700px){.app{display:block}.side{height:100dvh}.main{display:none;height:100dvh}.openchat .side{display:none}.openchat .main{display:flex}.back{display:block}.messages{padding:12px}}
</style></head><body>
<section id="authView" class="auth"><div class="card"><div class="logo">AXORA</div><h2>Connect with everyone.</h2><p class="muted">Secure sign-in to start messaging.</p><button id="google" style="width:100%">Continue with Google</button><p class="muted" style="text-align:center">— or email —</p><input id="name" class="field" placeholder="Your name"><input id="email" class="field" type="email" placeholder="Email address"><input id="password" class="field" type="password" placeholder="Password (minimum 6 characters)"><div class="actions"><button id="login">Log in</button><button id="register" class="alt">Create account</button></div><div id="authError" class="error"></div><p class="muted">Supabase project setup is required once by the owner.</p></div></section>
<div id="appView" class="app hide"><aside class="side"><div class="sidehead"><div class="row"><div class="logo">AXORA</div><button id="logout" class="alt">Log out</button></div><div id="myProfile" class="profile"></div><input id="findEmail" class="field" placeholder="Find user by exact email"><button id="startChat" style="width:100%">Start chat</button><div id="contactError" class="error"></div></div><div id="chatList" class="chatlist"><div class="empty">No conversations yet.</div></div></aside><main class="main"><div id="welcome" class="welcome"><div class="logo">AXORA</div><h2>Your messages, your space.</h2><p>Choose a conversation or find a user.</p></div><section id="chatPanel" class="chatpanel hide"><header class="chathead"><button id="back" class="alt back">‹</button><div class="avatar" id="peerAvatar">A</div><div class="chatmeta"><div id="peerName" class="chatname"></div><div id="peerEmail" class="chatmail"></div></div></header><div id="messages" class="messages"></div><div id="sendStatus" class="status"></div><form id="composer" class="composer"><input id="message" class="field" maxlength="4000" placeholder="Write a message…"><button id="send">Send</button></form></section></main></div>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const URL='YOUR_SUPABASE_PROJECT_URL',KEY='YOUR_SUPABASE_ANON_KEY',configured=URL.startsWith('https://')&&!URL.includes('YOUR_')&&!KEY.includes('YOUR_'),$=x=>document.getElementById(x);let sb,user,active=null,chats=[],mc=null,cc=null;
const say=(id,s)=>$(id).textContent=s||'';
function setup(){if(!configured){say('authError','Setup needed: paste Supabase Project URL and anon/public key in index.html, then run supabase-schema.sql.');return false}return true}
async function profile(){let{data,error}=await sb.from('profiles').upsert({id:user.id,email:user.email,display_name:user.user_metadata?.full_name||user.user_metadata?.name||user.email.split('@')[0],avatar_url:user.user_metadata?.avatar_url||null},{onConflict:'id'}).select().single();if(error)throw error;return data}
async function refreshChats(){let{data,error}=await sb.from('conversation_members').select('conversation_id,conversations(id,conversation_members(user_id,profiles(id,email,display_name)))').eq('user_id',user.id);if(error)throw error;chats=(data||[]).map(x=>{let p=x.conversations?.conversation_members?.find(m=>m.user_id!==user.id)?.profiles;return p?{id:x.conversation_id,peer:p}:null}).filter(Boolean);renderChats()}
function renderChats(){let box=$('chatList');box.innerHTML='';if(!chats.length){box.innerHTML='<div class="empty">No chats yet. Search for a registered user.</div>';return}chats.forEach(c=>{let d=document.createElement('div');d.className='chatitem'+(active?.id===c.id?' active':'');let a=document.createElement('div');a.className='avatar';a.textContent=(c.peer.display_name||'?')[0].toUpperCase();let m=document.createElement('div');m.className='chatmeta';let n=document.createElement('div');n.className='chatname';n.textContent=c.peer.display_name||c.peer.email;let e=document.createElement('div');e.className='chatmail';e.textContent=c.peer.email;m.append(n,e);d.append(a,m);d.onclick=()=>openChat(c);box.append(d)})}
async function loadMessages(){if(!active)return;let{data,error}=await sb.from('messages').select('id,sender_id,body,created_at').eq('conversation_id',active.id).order('created_at');if(error){say('sendStatus',error.message);return}let box=$('messages');box.innerHTML='';(data||[]).forEach(m=>{let b=document.createElement('div');b.className='bubble'+(m.sender_id===user.id?' mine':'');b.append(document.createTextNode(m.body));let t=document.createElement('time');t.textContent=new Date(m.created_at).toLocaleString();b.append(t);box.append(b)});box.scrollTop=box.scrollHeight}
async function openChat(c){active=c;renderChats();$('welcome').classList.add('hide');$('chatPanel').classList.remove('hide');$('appView').classList.add('openchat');$('peerName').textContent=c.peer.display_name||c.peer.email;$('peerEmail').textContent=c.peer.email;$('peerAvatar').textContent=(c.peer.display_name||'A')[0].toUpperCase();if(mc)sb.removeChannel(mc);await loadMessages();mc=sb.channel('msgs'+c.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+c.id},loadMessages).subscribe()}
$('google').onclick=async()=>{if(!setup())return;let{error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});if(error)say('authError',error.message)};
$('register').onclick=async()=>{if(!setup())return;let email=$('email').value.trim(),password=$('password').value;if(!email||password.length<6){say('authError','Enter a valid email and password of at least 6 characters.');return}say('authError','Creating account…');let{data,error}=await sb.auth.signUp({email,password,options:{data:{full_name:$('name').value.trim()}}});say('authError',error?error.message:(data.session?'Account created.':'Account created. Check your email to confirm, then log in.'))};
$('login').onclick=async()=>{if(!setup())return;let{error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});say('authError',error?.message||'')};
$('logout').onclick=()=>sb.auth.signOut();$('back').onclick=()=>$('appView').classList.remove('openchat');
$('startChat').onclick=async()=>{if(!user)return;let email=$('findEmail').value.trim().toLowerCase();if(!email){say('contactError','Enter a user email.');return}say('contactError','Searching…');let{data:p,error}=await sb.from('profiles').select('id,email,display_name,avatar_url').eq('email',email).maybeSingle();if(error)return say('contactError',error.message);if(!p)return say('contactError','No AXORA account found with this email.');if(p.id===user.id)return say('contactError','You cannot chat with yourself.');let{data:id,error:e}=await sb.rpc('create_direct_conversation',{target_user:p.id});if(e)return say('contactError',e.message);$('findEmail').value='';say('contactError','');await refreshChats();await openChat(chats.find(x=>x.id===id)||{id,peer:p})};
$('composer').onsubmit=async e=>{e.preventDefault();let body=$('message').value.trim();if(!body||!active)return;$('send').disabled=true;say('sendStatus','Sending…');let{error}=await sb.from('messages').insert({conversation_id:active.id,sender_id:user.id,body});if(error)say('sendStatus',error.message);else{$('message').value='';say('sendStatus','')} $('send').disabled=false};
async function enter(u){user=u;if(!u){$('authView').classList.remove('hide');$('appView').classList.add('hide');return}try{let p=await profile();$('myProfile').textContent=p.display_name+' · '+p.email;$('authView').classList.add('hide');$('appView').classList.remove('hide');await refreshChats();if(cc)sb.removeChannel(cc);cc=sb.channel('members'+u.id).on('postgres_changes',{event:'*',schema:'public',table:'conversation_members',filter:'user_id=eq.'+u.id},refreshChats).subscribe()}catch(e){say('authError',e.message);$('authView').classList.remove('hide')}}
if(configured){sb=createClient(URL,KEY);sb.auth.onAuthStateChange((_e,s)=>enter(s?.user||null));sb.auth.getSession().then(({data})=>enter(data.session?.user||null))}else say('authError','AXORA Supabase setup is required. See README.md.');if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
